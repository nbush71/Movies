<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="poster.css">
    <script src="https://kit.fontawesome.com/e74228a484.js" crossorigin="anonymous"></script>
    <link rel="icon" href="/favicon.ico">
    <title>Movies API - Search</title>
</head>
<body>
  <nav>
      <div class="movie__search">
        <a href="index.html">
          <button class="button">← Back</button>
        </a>
      </div>
    </nav>
    <section>
      <div class="movie__search--container">
          <label class="movie__search--label">
            Search:
          </label>
          <div class="input-wrap"><input type="text" placeholder="Search by Make, Model or Keyword"><div data-v-390ceb07="" class="search-wrapper flex justify-center align-center"><svg data-v-390ceb07="" aria-hidden="true" focusable="false" data-prefix="fas" data-icon="search" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="svg-inline--fa fa-search fa-w-16"><path data-v-390ceb07="" fill="currentColor" d="M505 442.7L405.3 343c-4.5-4.5-10.6-7-17-7H372c27.6-35.3 44-79.7 44-128C416 93.1 322.9 0 208 0S0 93.1 0 208s93.1 208 208 208c48.3 0 92.7-16.4 128-44v16.3c0 6.4 2.5 12.5 7 17l99.7 99.7c9.4 9.4 24.6 9.4 33.9 0l28.3-28.3c9.4-9.4 9.4-24.6.1-34zM208 336c-70.7 0-128-57.2-128-128 0-70.7 57.2-128 128-128 70.7 0 128 57.2 128 128 0 70.7-57.2 128-128 128z" class=""></path></svg></div></div>
      <div class="input__container">
            <div class="input__wrapper">
              <input class="input" type="text" placeholder="Search Movie Title" onchange="onSearchChange(event)">
                <div class="form button">
                      <label for="sortMenu">Sort:</label>
                        <select class="sort" name="sortMenu" id="sortMenu">
                          <option value="az" selected>Alphabetical A to Z</option>
                          <option value="za">Alphabetical Z to A</option>
                          <option value="newest">Newest to oldest</option>
                          <option value="oldest">Oldest to Newest</option>
                        </select>
                  </div>    
              </div>
          </div>
    </section>
  <div class="movie-list">
    <div class="container">
        <div class="row">
            <div class="movie_list">
                <div class="movie">
                    <div class="movie-card" onclick="showMovieTitle(title)">
                        <div class="movie__card--container">
                          <br>
                            <p><b>Movie Title:</b></p>
                            <p><b>Year:</b></p>
                            <p><b>ID:</b></p>
                            <p><b>Poster:</b></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
  </div>
</body>
<script src="poster.js"></script>
</html>
